<body>
  <!-- mk-loading:start -->
  <!-- 2026-11-22 : écran de chargement. Sans lui, les pages de l'application
       (demande de livraison, connexion, inscription chauffeur) restaient
       blanches plusieurs secondes sur téléphone. Masqué dès la première
       image de l'application. Retiré des pages publiques, qui affichent
       déjà leur texte (lib/seo/seo_html.dart). -->
  <style>
    #movik-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:18px;background:#F6F8FC;color:#0F2A5C;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;z-index:1}
    #movik-loading strong{font-size:30px;letter-spacing:.5px}
    #movik-loading span{font-size:15px;color:#4A5B7A}
    #movik-loading i{width:34px;height:34px;border:4px solid #D5E3F7;border-top-color:#0879E8;
      border-radius:50%;animation:mk-spin .9s linear infinite}
    @keyframes mk-spin{to{transform:rotate(360deg)}}
  </style>
  <div id="movik-loading" role="status" aria-live="polite">
    <strong>Movi-K</strong>
    <i aria-hidden="true"></i>
    <span>Chargement… / Loading…</span>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var e = document.getElementById("movik-loading");
      if (e) e.remove();
    });
  </script>
  <!-- mk-loading:end -->
  <script src="flutter_bootstrap.js" async></script>
</body>
