<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F2A5C">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Page introuvable | Movi-K</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F8FC;
      color: #0F2A5C;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    main { max-width: 520px; text-align: center; }
    .brand { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; margin: 0 0 24px; color: #0F2A5C; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 8px; line-height: 1.5; color: #54607A; }
    .other { margin-top: 20px; font-size: 14px; }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 12px;
      background: #0F2A5C;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
    }
    .other a { color: #1E4B94; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Movi-K</p>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <a class="button" href="/fr">Retour à l'accueil</a>
    <div class="other">
      <p lang="en">Page not found. <a href="/en">Go to the home page</a></p>
      <p lang="es">Página no encontrada. <a href="/es">Ir a la página de inicio</a></p>
    </div>
  </main>
</body>
</html>
