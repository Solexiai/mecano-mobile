name: Flutter validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/**', 'test/**', 'analysis_options.yaml', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/flutter-validation.yml']
  push:
    branches:
      - fix/quote-mission-payment-integrity

permissions:
  contents: read

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.1"
      FLUTTER_COMMIT: "6655482ec06e547f90abf8ae7590466f4415978d"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git \
            .flutter
          test "$(git -C .flutter rev-parse HEAD)" = "${FLUTTER_COMMIT}"
          echo "${GITHUB_WORKSPACE}/.flutter/bin" >> "${GITHUB_PATH}"

      - name: Report Flutter environment
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        shell: bash
        env:
          # Confirmation date fixtures explicitly cover Quebec winter/summer time.
          TZ: America/Toronto
        run: |
          set +e
          flutter test --dart-define=no_default_http_client=true --reporter expanded > flutter-tests.log 2>&1
          result=$?
          grep -B 4 -A 15 -E '\[E\]|EXCEPTION|Expected:|Actual:|Error:|Some tests failed|All tests passed' flutter-tests.log || true
          tail -n 8 flutter-tests.log
          # Surface failing tests through the Checks API (raw logs are not
          # always downloadable). GitHub keeps at most 10 annotations per step,
          # so names are grouped into a single annotation, details into chunks.
          if [ "$result" -ne 0 ]; then
            names="$(grep -E '\[E\]$' flutter-tests.log | sed -E 's/^[0-9:]+ \+[0-9]+( ~[0-9]+)? -[0-9]+: //' | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##' | sort -u | head -n 120)"
            count="$(printf '%s\n' "$names" | grep -c . || true)"
            enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
            echo "::error title=Flutter failing tests (${count})::$(printf '%s\n' "$names" | enc)"
            grep -B 2 -A 18 -E '^(Expected|Error|.*EXCEPTION CAUGHT)' flutter-tests.log | head -n 900 > flutter-failure-details.txt || true
            split -l 150 flutter-failure-details.txt flutter-details-part- || true
            n=0
            for part in flutter-details-part-*; do
              [ -f "$part" ] || continue
              n=$((n+1)); [ "$n" -gt 6 ] && break
              echo "::error title=Flutter failure details ${n}::$(enc < "$part")"
            done
          fi
          exit "$result"

      - name: Build Flutter Web with repository script
        if: ${{ !cancelled() }}
        env:
          GOOGLE_MAPS_API_KEY: ""
          FCM_WEB_VAPID_KEY: ""
        run: bash scripts/vercel_build.sh
