name: Flutter validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/**', 'test/**', 'analysis_options.yaml', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/flutter-validation.yml']
  push:
    branches:
      - fix/quote-mission-payment-integrity

permissions:
  contents: read

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.1"
      FLUTTER_COMMIT: "6655482ec06e547f90abf8ae7590466f4415978d"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git \
            .flutter
          test "$(git -C .flutter rev-parse HEAD)" = "${FLUTTER_COMMIT}"
          echo "${GITHUB_WORKSPACE}/.flutter/bin" >> "${GITHUB_PATH}"

      - name: Report Flutter environment
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        shell: bash
        env:
          # Confirmation date fixtures explicitly cover Quebec winter/summer time.
          TZ: America/Toronto
        run: |
          set +e
          flutter test --dart-define=no_default_http_client=true --reporter expanded > flutter-tests.log 2>&1
          result=$?
          grep -B 4 -A 15 -E '\[E\]|EXCEPTION|Expected:|Actual:|Error:|Some tests failed|All tests passed' flutter-tests.log || true
          tail -n 8 flutter-tests.log
          # Failing test names for the Checks API (see the report steps below).
          grep -E '\[E\]$' flutter-tests.log | sed -E 's/^[0-9:]+ \+[0-9]+( ~[0-9]+)? -[0-9]+: //' | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##' | sort -u > flutter-failing.txt || true
          exit "$result"

      - name: Report failing tests 1-9
        if: ${{ failure() && hashFiles('flutter-failing.txt') != '' }}
        shell: bash
        run: |
          sed -n '1,9p' flutter-failing.txt | while IFS= read -r line; do
            echo "::error title=Flutter test failed::${line}"
          done
      - name: Report failing tests 10-18
        if: ${{ failure() && hashFiles('flutter-failing.txt') != '' }}
        shell: bash
        run: |
          sed -n '10,18p' flutter-failing.txt | while IFS= read -r line; do
            echo "::error title=Flutter test failed::${line}"
          done
      - name: Report failing tests 19-27
        if: ${{ failure() && hashFiles('flutter-failing.txt') != '' }}
        shell: bash
        run: |
          sed -n '19,27p' flutter-failing.txt | while IFS= read -r line; do
            echo "::error title=Flutter test failed::${line}"
          done
      - name: Report failing tests 28-36
        if: ${{ failure() && hashFiles('flutter-failing.txt') != '' }}
        shell: bash
        run: |
          sed -n '28,36p' flutter-failing.txt | while IFS= read -r line; do
            echo "::error title=Flutter test failed::${line}"
          done
      - name: Report failing tests 37-45
        if: ${{ failure() && hashFiles('flutter-failing.txt') != '' }}
        shell: bash
        run: |
          sed -n '37,45p' flutter-failing.txt | while IFS= read -r line; do
            echo "::error title=Flutter test failed::${line}"
          done
      - name: Report failure details (first 9 tests)
        if: ${{ failure() && hashFiles('flutter-tests.log') != '' }}
        shell: bash
        env:
          # Temporary triage focus on tests that do not fail on the agenda baseline.
          DETAIL_FOCUS: 'booking_terms_test|photo_analysis_flow_test|photo_offer_journey_test'
        run: |
          # Short, bounded excerpt per failing test (large annotations are dropped).
          # Flutter prints the exception block *before* the "[E]" line, so keep
          # the preceding block and only its most useful lines.
          awk 'function keep(l) { return l ~ /thrown|Expected|Actual|Which|Error|Exception|overflow|Bad state|No element|Found|not found|_test\.dart[ :][0-9]+:[0-9]+/ }
               function flush() { print cur "\t" body }
               /^[0-9]+:[0-9]+ \+[0-9]+/ { if (cur != "") flush(); cur = ""; if ($0 ~ /\[E\]$/) { cur = $0; body = prev } prev = ""; n = 0; next }
               keep($0) && n < 22 { line = substr($0, 1, 160); gsub(/%/, "%25", line); prev = prev line "%0A"; if (cur != "") body = body line "%0A"; n++ }
               END { if (cur != "") flush() }' flutter-tests.log | grep -E "${DETAIL_FOCUS:-.}" | head -n 9 | while IFS=$'\t' read -r name body; do
            short="$(printf '%s' "$name" | sed -E 's/^[0-9:]+ \+[0-9]+( ~[0-9]+)? -[0-9]+: //; s#^/home/runner/work/[^/]+/[^/]+/##' | cut -c1-150)"
            echo "::error title=Detail ${short}::${body:0:2500}"
          done
      - name: Build Flutter Web with repository script
        if: ${{ !cancelled() }}
        env:
          GOOGLE_MAPS_API_KEY: ""
          FCM_WEB_VAPID_KEY: ""
        run: bash scripts/vercel_build.sh
