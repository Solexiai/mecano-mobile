name: Firebase validation

on:
  pull_request:
    paths: ['functions/**', 'firestore.rules', 'storage.rules', 'firebase.json', 'firestore.indexes.json', '.github/workflows/firebase-validation.yml']
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'storage.rules', 'firebase.json', 'firestore.indexes.json', '.github/workflows/firebase-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Install pinned emulator CLI
        run: npm install --global firebase-tools@15.28.2
      - name: Lint and build
        working-directory: functions
        run: npm run lint && npm run build
      - name: Unit tests (no cloud credentials)
        working-directory: functions
        run: npm run test:unit -- --runInBand
      - name: Integration tests (demo project and emulators only)
        working-directory: functions
        run: npm run test:integration
