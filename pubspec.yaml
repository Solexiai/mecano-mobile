name: movik_connect
description: "Movi-k - Local service marketplace: large-item delivery & mobile mechanics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Bloc W-6 (Phase 7, cleanup) : `cupertino_icons`, `intl` et `http` étaient
  # déclarés comme dépendances DIRECTES mais jamais importés nulle part dans
  # `lib/` (0 `CupertinoIcons.`, 0 `import 'package:intl`, 0
  # `import 'package:http`, vérifié par recherche exhaustive). Retirés :
  # `intl`/`http` restent disponibles en dépendance TRANSITIVE (tirés par
  # `flutter_localizations`/autres packages, `flutter pub get` confirme
  # `dependency: transitive` sans changement de version) donc rien ne casse ;
  # `cupertino_icons` n'est plus nécessaire du tout. `flutter analyze`/
  # `flutter test` revalidés après retrait (0 issue, 504/504 PASS).
  provider: 6.1.5+1
  go_router: ^14.6.2
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  uuid: ^4.5.1
  image_picker: ^1.1.2

  # --- Firebase (architecture backend réelle, voir lib/backend/) ---
  # Versions verrouillées pour compatibilité Flutter 3.35.4 / Dart 3.9.2.
  # NE PAS mettre à jour sans revalider la compatibilité complète.
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  firebase_storage: 12.3.2
  cloud_functions: 5.1.3
  firebase_app_check: 0.3.1+4

  # --- Tracking GPS temps réel (Phase 5) ---
  # flutter_map (OpenStreetMap) choisi plutôt que google_maps_flutter :
  # aucune clé API / facturation Google Cloud requise côté Daniel, ce qui
  # permet de livrer la Phase 5 de façon 100% autonome (voir directive
  # MODE AUTONOME). Compatible Web + Android.
  flutter_map: 7.0.2
  latlong2: 0.9.1
  geolocator: 13.0.2
  permission_handler: 11.3.1

  # --- Stripe Connect Onboarding (Bloc 8B, PRIORITÉ 1) ---
  # Ouvre l'URL d'onboarding hébergée par Stripe (jamais un formulaire de
  # carte/compte bancaire dans Movi-K lui-même — voir stripeProvider.ts
  # ::createDriverAccount, accountLinks.create). Aucun secret Stripe n'est
  # jamais chargé côté Flutter : cette dépendance ne fait qu'ouvrir un
  # navigateur externe/onglet vers une URL déjà générée par la Cloud
  # Function `createDriverStripeAccount`.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  geolocator_platform_interface: 4.2.8
  image_picker_platform_interface: 2.11.1

flutter:
  uses-material-design: true
  # Bloc W (Phase 7, cleanup) : `assets/images/` et `assets/icons/` étaient
  # déclarés ici mais n'existent PAS sur disque (0 fichier, jamais commités)
  # et ne sont référencés par AUCUN `Image.asset()`/`AssetImage()` dans
  # `lib/` (vérifié par recherche exhaustive) — source du warning
  # `asset_directory_does_not_exist` signalé depuis plusieurs blocs
  # précédents (T2/U). Retiré : ce ne sont pas des assets utilisés par
  # l'app, juste une déclaration orpheline. `assets/icon/app_icon.png`
  # (singulier, non lié à ce bloc) reste sur disque mais n'est pas non
  # plus déclaré ici car aucune Cloud Function/écran ne le charge via
  # `Image.asset` — c'est un fichier source pour la génération d'icônes
  # de lancement (hors scope `flutter:assets`), pas un asset embarqué.
