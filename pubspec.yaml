name: movik_connect
description: "Movi-k - Local service marketplace: large-item delivery & mobile mechanics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  go_router: ^14.6.2
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  http: 1.5.0

  # --- Firebase (architecture backend réelle, voir lib/backend/) ---
  # Versions verrouillées pour compatibilité Flutter 3.35.4 / Dart 3.9.2.
  # NE PAS mettre à jour sans revalider la compatibilité complète.
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  firebase_storage: 12.3.2
  cloud_functions: 5.1.3
  firebase_app_check: 0.3.1+4

  # --- Tracking GPS temps réel (Phase 5) ---
  # flutter_map (OpenStreetMap) choisi plutôt que google_maps_flutter :
  # aucune clé API / facturation Google Cloud requise côté Daniel, ce qui
  # permet de livrer la Phase 5 de façon 100% autonome (voir directive
  # MODE AUTONOME). Compatible Web + Android.
  flutter_map: 7.0.2
  latlong2: 0.9.1
  geolocator: 13.0.2
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  geolocator_platform_interface: 4.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
