name: movik_connect
description: "Movi-k - Local service marketplace: large-item delivery & mobile mechanics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  go_router: ^14.6.2
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  http: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
